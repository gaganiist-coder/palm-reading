<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Palm Reading · हस्तरेखा</title>
<meta name="description" content="Photograph your left palm and get a 10-area reading based on classic palmistry and Hast Rekha Shastra.">
<meta name="theme-color" content="#5b2a63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta property="og:title" content="Palm Reading · हस्तरेखा">
<meta property="og:description" content="What does your left hand say about you? Love, mind, career, money and more.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235b2a63'/%3E%3Cpath d='M18 40c6-3 14-4 26-8M20 30c8-2 16-2 26-6M38 52c-6-8-6-18-2-28' stroke='%23f0a24a' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Mulish:wght@400;600;700;800&family=Tiro+Devanagari+Hindi&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0} img{max-width:100%} [hidden]{display:none!important}

/* Layout: one mobile-first column, screen-by-screen app (home → photo → confirm → reading), sticky action bar at the foot */
:root{
  --bg:#f7f1f4; --surface:#fffafc; --sunk:#efe5eb; --ink:#2b1631; --muted:#6e5a72; --rule:#e3d4dd;
  --plum:#5b2a63; --accent:#c8641c; --accent-soft:#f6e1cf; --rose:#a8355f;
  --palm:#f3dccd; --palm-edge:#c99f8a; --line:#9a6a6a;
  --good:#3f7d5a; --warn:#a86a12;
  --display:"Yeseva One", Georgia, "Times New Roman", serif;
  --body:"Mulish", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --hindi:"Tiro Devanagari Hindi", "Noto Sans Devanagari", "Mangal", serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1a0f1d; --surface:#24152a; --sunk:#2e1c35; --ink:#f4e9f1; --muted:#bba7bd; --rule:#3d2845;
  --plum:#d9a6e0; --accent:#f0a24a; --accent-soft:#3f2a1c; --rose:#ec8bb0;
  --palm:#4a3036; --palm-edge:#7d5a5d; --line:#c79a94; --good:#7fc79a; --warn:#e8b25a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a0f1d; --surface:#24152a; --sunk:#2e1c35; --ink:#f4e9f1; --muted:#bba7bd; --rule:#3d2845;
  --plum:#d9a6e0; --accent:#f0a24a; --accent-soft:#3f2a1c; --rose:#ec8bb0;
  --palm:#4a3036; --palm-edge:#7d5a5d; --line:#c79a94; --good:#7fc79a; --warn:#e8b25a; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:0}
.app{max-width:560px;margin:0 auto;padding-block:20px 120px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.15;text-wrap:balance;margin:0;color:var(--ink)}
h1{font-size:clamp(2.1rem,8vw,2.8rem)}
h2{font-size:1.7rem}
h3{font-size:1.25rem}
p{margin:0}
.hi{font-family:var(--hindi);font-size:.95em}
.label{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.wordmark{font-family:var(--display);font-size:1.15rem;color:var(--plum);display:flex;align-items:baseline;gap:8px}
.wordmark .hi{color:var(--muted);font-size:.9rem}
.linkbtn{background:none;border:0;color:var(--plum);font:inherit;font-weight:700;font-size:.9rem;cursor:pointer;padding:6px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;border:1.5px solid var(--plum);background:transparent;color:var(--plum);font:inherit;font-weight:800;font-size:1rem;padding:13px 22px;cursor:pointer;min-height:48px;text-align:center}
.btn.primary{background:var(--plum);color:var(--bg)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#24120a}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.chip:focus-visible,.linkbtn:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btnrow{display:flex;flex-wrap:wrap;gap:10px}
.btnrow .btn{flex:1 1 180px}

/* Home */
.hero{display:grid;grid-template-columns:1fr;gap:8px;align-items:center}
.hero-art{position:relative;margin:4px auto 0;width:min(320px,86%)}
.hero-art svg{width:100%;height:auto;display:block}
.hero p.lede{font-size:1.08rem;color:var(--muted);max-width:34em}
.areas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px;margin:0;padding:0;list-style:none}
.areas li{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--rule);font-weight:600;font-size:.95rem;min-width:0}
.areas li .n{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:800;font-size:.8rem;min-width:1.4em}
.note{font-size:.85rem;color:var(--muted);border-top:1px solid var(--rule);padding-top:14px}

/* Photo */
.tips{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.tips li{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:12px 14px}
.tips svg{flex:none;width:28px;height:28px;color:var(--plum)}
.photo{border-radius:18px;overflow:hidden;background:var(--sunk);aspect-ratio:3/4;max-width:100%;display:grid;place-items:center;position:relative}
.photo img{width:100%;height:100%;object-fit:cover}
.photo .empty{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted);padding:24px;text-align:center}
.photo .empty svg{width:120px;opacity:.8}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.status{border-radius:14px;padding:14px 16px;background:var(--surface);border:1px solid var(--rule);display:flex;gap:12px;align-items:center}
.status.err{border-color:var(--rose)}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid var(--rule);border-top-color:var(--accent);animation:spin 1s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.scan-art .ln{stroke-dasharray:420;stroke-dashoffset:420;animation:draw 2.4s ease-in-out infinite alternate}
@keyframes draw{to{stroke-dashoffset:0}}

/* Confirm */
.progress{height:6px;border-radius:6px;background:var(--sunk);overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);transition:width .3s}
.group{background:var(--surface);border:1px solid var(--rule);border-radius:18px;padding:16px;display:grid;grid-template-columns:76px minmax(0,1fr);gap:4px 14px}
.group>.g-art{grid-row:span 2}
.group>.g-art svg{width:76px;height:auto;display:block}
.group h3{font-size:1.15rem;align-self:end}
.group .g-sub{font-size:.85rem;color:var(--muted)}
.qs{grid-column:1/-1;display:grid;gap:14px;margin-top:10px}
.q{display:grid;gap:6px;border-top:1px dashed var(--rule);padding-top:12px}
.q-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.q-head strong{font-size:.95rem}
.q .help{font-size:.82rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--rule);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:.88rem;font-weight:600;cursor:pointer;text-align:left}
.chip[aria-pressed="true"]{border-color:var(--plum);background:var(--plum);color:var(--bg)}
.badge{font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 9px;white-space:nowrap}
.badge.high{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.badge.medium{background:var(--accent-soft);color:var(--accent)}
.badge.low{background:var(--sunk);color:var(--muted)}
.badge.you{background:color-mix(in srgb,var(--plum) 16%,transparent);color:var(--plum)}

/* Reading */
.result-hero{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--rule);border-radius:22px;padding:20px}
.result-hero svg{width:120px;height:auto}
.element{font-family:var(--display);font-size:2rem;color:var(--plum);line-height:1.1}
.sample-flag{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:.9rem}
.cards{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:18px;overflow:hidden}
.card summary{list-style:none;cursor:pointer;padding:16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:center}
.card summary::-webkit-details-marker{display:none}
.card .num{font-variant-numeric:tabular-nums;font-weight:800;color:var(--accent);font-size:.85rem;width:1.6em}
.card .cat{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.card .cat .label{color:var(--muted)}
.card .headline{grid-column:2/3;font-family:var(--display);font-size:1.2rem;line-height:1.2}
.meter{display:flex;gap:4px;grid-row:1/3;grid-column:3;align-self:center}
.meter i{width:8px;height:8px;border-radius:50%;background:var(--rule);display:block}
.meter i.on{background:var(--accent)}
.card .body{padding:0 16px 18px 16px;display:grid;grid-template-columns:minmax(0,1fr) 72px;gap:14px}
.card .body p{font-size:.98rem;max-width:62ch}
.card .body p+p{margin-top:8px}
.card .mini svg{width:72px;height:auto}
.from{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.from span.src{font-size:.78rem;border:1px solid var(--rule);border-radius:999px;padding:2px 10px;color:var(--muted)}
.caveat{grid-column:1/-1;font-size:.82rem;color:var(--muted);font-style:italic}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:.9rem;z-index:20}

.actionbar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--rule);z-index:10}
.actionbar .inner{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center}
.actionbar .btn{flex:1}
.actionbar .meta{font-size:.82rem;color:var(--muted);white-space:nowrap}
textarea.copybox{width:100%;min-height:140px;font:inherit;font-size:.85rem;border-radius:12px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);padding:10px}

@media (prefers-reduced-motion:reduce){.scan-art .ln{animation:none;stroke-dashoffset:0}.spinner{animation-duration:3s}}
@media (max-width:420px){.areas{grid-template-columns:1fr}.result-hero{grid-template-columns:1fr}.result-hero svg{display:none}.card .body{grid-template-columns:1fr}.card .mini{display:none}}

/* Live camera */
.cam{position:relative;border-radius:22px;overflow:hidden;background:#120a14;aspect-ratio:3/4;max-width:100%;width:100%}
.cam video,.cam img.still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam .guide{position:absolute;inset:6% 8%;pointer-events:none}
.cam .guide svg{width:100%;height:100%}
.cam .guide path,.cam .guide rect{fill:none;stroke:#fff;stroke-width:3;stroke-dasharray:9 7;opacity:.85;transition:stroke .2s}
.cam.ready .guide path,.cam.ready .guide rect{stroke:#f0a24a;stroke-dasharray:none;opacity:1}
.cam .pill{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(20,10,22,.72);color:#fff;font-weight:700;font-size:.92rem;padding:8px 14px;border-radius:999px;white-space:nowrap;max-width:calc(100% - 28px);overflow:hidden;text-overflow:ellipsis;backdrop-filter:blur(6px)}
.cam .hold{position:absolute;left:0;bottom:0;height:5px;background:#f0a24a;width:0;transition:width .12s linear}
.cam .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.cam .flash.on{opacity:.85;transition:none}
.shutter{width:72px;height:72px;border-radius:50%;border:4px solid var(--plum);background:var(--surface);cursor:pointer;flex:none;display:grid;place-items:center}
.shutter::after{content:"";width:54px;height:54px;border-radius:50%;background:var(--plum)}
.shutter:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.shutter-row{display:flex;align-items:center;justify-content:center;gap:18px}
.shutter-row .side{flex:1;display:flex}
.shutter-row .side:last-child{justify-content:flex-end}
.privacy{font-size:.82rem;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.privacy svg{width:16px;height:16px;flex:none;margin-top:3px}
/* Photo reference on the questions screen */
.ref{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:12px;align-items:center;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);padding:10px 0;border-bottom:1px solid var(--rule)}
.ref img{width:56px;height:74px;object-fit:cover;border-radius:10px;border:1px solid var(--rule)}
.ref p{font-size:.85rem;color:var(--muted);flex:1;min-width:0}
.zoom{position:fixed;inset:0;background:rgba(10,4,12,.92);z-index:30;display:grid;place-items:center;padding:16px}
.zoom img{max-height:90vh;max-width:100%;border-radius:14px}
.zoom button{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px}
.rate{background:var(--surface);border:1px solid var(--rule);border-radius:18px;padding:16px;display:grid;gap:10px}

</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="actionbar" id="bar" hidden><div class="inner" id="barInner"></div></div>
<div class="toast" id="toast" hidden></div>
<script>

/* ---------- Palm drawing (left palm, as you look at it) ---------- */
const LINES = {
  heart:'M66 206 C 105 196, 150 194, 196 180',
  head:'M226 216 C 185 226, 130 238, 84 262',
  life:'M226 212 C 196 238, 188 300, 202 366',
  fate:'M150 368 C 149 320, 151 262, 154 200',
  sun:'M118 292 C 117 262, 116 236, 117 210',
  marriage:'M63 188 L80 187 M63 181 L76 180',
  travel:'M63 300 L82 298 M63 314 L78 313',
  triangle:'M152 242 L112 298 L170 300 Z'
};
const MOUNTS = { venus:[212,318,28], luna:[90,318,26], jupiter:[196,188,13], apollo:[116,186,12] };
const FINGERS = { pinky:[64,112,30,100], ring:[100,62,33,140], middle:[139,46,34,150], index:[179,70,33,130] };
function palmSVG(hl=[], o={}){
  const H = new Set(hl);
  const palmPath='M62 182 Q62 172 74 172 L214 172 Q231 175 233 200 L236 300 Q236 352 198 376 L108 376 Q70 362 64 300 Z';
  const thumb = `<rect x="226" y="196" width="36" height="112" rx="18" transform="rotate(28 244 300)"/>`;
  const fingers = Object.values(FINGERS).map(([x,y,w,h])=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="15"/>`).join('');
  const shapes = `<path d="${palmPath}"/>${fingers}${thumb}`;
  const anyHL = H.size>0;
  let marks='';
  for (const [k,[cx,cy,r]] of Object.entries(MOUNTS)) if (H.has(k)) marks+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--accent)" fill-opacity=".22" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4 4"/>`;
  for (const k of ['index','ring']) if (H.has(k)){const [x,y,w,h]=FINGERS[k];marks+=`<rect x="${x}" y="${y}" width="${w}" height="${h-30}" rx="15" fill="none" stroke="var(--accent)" stroke-width="3"/>`;}
  if (H.has('thumb')) marks+=`<rect x="226" y="196" width="36" height="112" rx="18" transform="rotate(28 244 300)" fill="none" stroke="var(--accent)" stroke-width="3"/>`;
  if (H.has('shape')) marks+=`<path d="${palmPath}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="6 5"/>`;
  const show = o.only ? o.only : Object.keys(LINES).filter(k=>k!=='triangle'&&k!=='travel');
  let lines='';
  for (const k of Object.keys(LINES)){
    const on = H.has(k);
    if (!on && !show.includes(k)) continue;
    const dash = k==='triangle' ? ' stroke-dasharray="5 4"' : '';
    lines+=`<path class="ln" d="${LINES[k]}" fill="none" stroke="${on?'var(--accent)':'var(--line)'}" stroke-width="${on?5:(anyHL?2:3)}" stroke-linecap="round" opacity="${on||!anyHL?1:.45}"${dash}/>`;
  }
  let labels='';
  if (o.labels){
    const L=(x,y,a,en,hi)=>`<text x="${x}" y="${y}" text-anchor="${a}" font-family="Mulish, sans-serif" font-size="11" font-weight="800" fill="var(--ink)">${en}</text><text x="${x}" y="${y+13}" text-anchor="${a}" font-family="Tiro Devanagari Hindi, serif" font-size="11" fill="var(--muted)">${hi}</text>`;
    labels = L(4,232,'start','Heart','हृदय')+L(4,262,'start','Head','मस्तिष्क')+L(316,380,'end','Life','जीवन')+L(150,394,'middle','Fate','भाग्य');
  }
  const vb = o.labels ? '0 26 320 384' : '40 30 280 352';
  return `<svg viewBox="${vb}" role="img" aria-label="${o.aria||'Left palm diagram'}" xmlns="http://www.w3.org/2000/svg">
    <g fill="var(--palm-edge)" stroke="var(--palm-edge)" stroke-width="6" stroke-linejoin="round">${shapes}</g>
    <g fill="var(--palm)">${shapes}</g>${marks}${lines}${labels}</svg>`;
}

/* ---------- Questions (feature schema) ---------- */
const GROUPS = [
 {id:'shape', title:'Hand shape', hi:'हाथ का आकार', sub:'Sets your basic temperament', hl:['shape'], qs:[
  {id:'hand', label:'Palm and finger proportions', help:'Palm length runs wrist to finger base. "Long" fingers are close to the palm\'s length.', opts:[['earth','Square palm, short fingers'],['air','Square palm, long fingers'],['fire','Long palm, short fingers'],['water','Long palm, long fingers']]}]},
 {id:'heart', title:'Heart line', hi:'हृदय रेखा', sub:'Top line, starts under the little finger', hl:['heart'], qs:[
  {id:'heartEnd', label:'Where it ends', opts:[['jupiter','Under the index finger'],['between','Between index and middle'],['saturn','Under the middle finger']]},
  {id:'heartCurve', label:'Its shape', opts:[['curved','Curves upward'],['straight','Fairly straight']]},
  {id:'heartLength', label:'Its length', opts:[['long','Long, crosses most of the palm'],['short','Short']]},
  {id:'heartMarks', label:'Along the line', opts:[['clear','Clean and unbroken'],['branches','Small branches rising'],['broken','Breaks or chain-like']]}]},
 {id:'head', title:'Head line', hi:'मस्तिष्क रेखा', sub:'Middle line, starts near the thumb', hl:['head'], qs:[
  {id:'headShape', label:'Its direction', opts:[['straight','Straight across'],['sloping','Slopes down toward the wrist']]},
  {id:'headLength', label:'Its length', opts:[['long','Long'],['medium','Medium'],['short','Short']]},
  {id:'headStart', label:'Where it starts', opts:[['joined','Joined to the life line'],['separate','Separate from the life line']]},
  {id:'headFork', label:'A fork at its end?', opts:[['yes','Yes, it splits in two'],['no','No']]}]},
 {id:'life', title:'Life line', hi:'जीवन रेखा', sub:'Curves around the base of the thumb', hl:['life'], qs:[
  {id:'lifeArc', label:'Its curve', opts:[['wide','Sweeps wide into the palm'],['close','Hugs the thumb']]},
  {id:'lifeDepth', label:'How deep it looks', opts:[['deep','Deep and clear'],['faint','Faint or thin']]},
  {id:'lifeBreak', label:'Any breaks?', opts:[['none','Unbroken'],['break','Has a break or gap']]}]},
 {id:'fate', title:'Fate and sun lines', hi:'भाग्य व सूर्य रेखा', sub:'Vertical lines up the centre and under the ring finger', hl:['fate','sun'], qs:[
  {id:'fate', label:'Fate line (centre, rising toward the middle finger)', opts:[['strong','Strong and clear'],['faint','Faint'],['absent','Can\'t see one']]},
  {id:'fateStart', label:'Where the fate line starts', showIf:f=>f.fate&&f.fate.v!=='absent', opts:[['wrist','At the wrist'],['life','From the life line'],['luna','From the outer palm edge']]},
  {id:'sun', label:'Sun line (short line under the ring finger)', opts:[['present','I can see one'],['absent','Can\'t see one']]}]},
 {id:'fingers', title:'Fingers and thumb', hi:'उँगलियाँ व अँगूठा', sub:'Hold fingers together and straight', hl:['index','ring','thumb'], qs:[
  {id:'indexVsRing', label:'Index finger compared with ring finger', opts:[['longer','Index is longer'],['equal','About equal'],['shorter','Index is shorter']]},
  {id:'thumbLength', label:'Thumb length', help:'Long if the tip passes the middle of the index finger\'s lowest section.', opts:[['long','Long'],['average','Average'],['short','Short']]},
  {id:'thumbAngle', label:'Thumb spread', opts:[['wide','Opens wide from the hand'],['narrow','Stays close to the hand']]}]},
 {id:'mounts', title:'Mounts', hi:'पर्वत', sub:'Fleshy pads of the palm', hl:['venus','luna','jupiter'], qs:[

const CW = {high:1, medium:.8, low:.4};
function lcFirst(s){return s.charAt(0).toLowerCase()+s.slice(1)}
function area(F){
  const c={parts:[],score:0,max:0,src:new Set(),hl:new Set()};
  c.add=(id,map,src,hl,w=1)=>{
    const f=F[id]; if(!f||!map[f.v]) return null;
    const [text,pos]=map[f.v]; const cw=CW[f.c]||.8;
    c.parts.push(f.c==='low' ? 'There are hints that '+lcFirst(text) : text);
    c.score+=pos*w*cw; c.max+=w*cw; if(src) c.src.add(src); (hl||[]).forEach(h=>c.hl.add(h));
    return f.v;
  };
  return c;
}

function buildReading(F){
  return CATS.map((cat,i)=>{
    const c=cat.run(F);
    const strength = c.max ? Math.max(1,Math.min(5,Math.round(1+4*((c.score/c.max-0.5)/0.45)))) : 0;
    const headline = c.headline || (c.parts.length ? 'A partial reading' : 'Not enough detail yet');
    return {i:i+1,key:cat.key,name:cat.name,hi:cat.hi,caveat:cat.caveat,headline,parts:c.parts,strength,src:[...c.src],hl:[...c.hl]};
  });
}

let landmarker = null, mpState = 'idle'; // idle | loading | ready | failed

async function loadMP(){
  if (mpState!=='idle') return;
  mpState='loading';
  try{
    const vision = await import(MP_URL);
    const files = await vision.FilesetResolver.forVisionTasks(MP_WASM);
    const opts = (delegate)=>({ baseOptions:{ modelAssetPath:MP_MODEL, delegate }, runningMode:'VIDEO', numHands:1, minHandDetectionConfidence:.6, minTrackingConfidence:.5 });
    try{ landmarker = await vision.HandLandmarker.createFromOptions(files, opts('GPU')); }
    catch(e){ landmarker = await vision.HandLandmarker.createFromOptions(files, opts('CPU')); }
    mpState='ready';
  }catch(e){ console.warn('Hand tracking unavailable', e); mpState='failed'; }
}

function setPill(t){ const p=document.getElementById('pill'); if(p) p.textContent=t; }
async function startCam(){
  loadMP();
  try{
    CAM.stream = await navigator.mediaDevices.getUserMedia({ audio:false, video:{ facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1440} } });
    if (S.screen!=='photo'){ stopCam(); return; }
    const v=document.getElementById('vid'); v.srcObject=CAM.stream; await v.play().catch(()=>{});
    CAM.steady=0; CAM.last=null; CAM.phase='live';
    setPill('Fit your palm inside the outline');
    loop();
  }catch(e){
    const denied = e && (e.name==='NotAllowedError' || e.name==='SecurityError');
    setPill(denied ? 'Camera blocked. Use “Phone camera” below' : 'No camera found. Use “Phone camera” below');
    if (denied) toast('To use the live camera, allow camera access in your browser settings');
  }
}
function stopCam(){
  cancelAnimationFrame(CAM.raf); CAM.phase='idle';
  if (CAM.stream){ CAM.stream.getTracks().forEach(t=>t.stop()); CAM.stream=null; }
}
function loop(){
  if (CAM.phase!=='live') return;
  CAM.raf = requestAnimationFrame(loop);
  const now = performance.now(); if (now-CAM.lastT < 90) return; CAM.lastT = now;
  const v=document.getElementById('vid'); if(!v || v.readyState<2) return;
  const cam=document.getElementById('cam'), hold=document.getElementById('hold');
  if (mpState!=='ready'){ setPill(mpState==='failed'?'Line up your palm, then tap the button':'Line up your palm…'); return; }
  let res; try{ res = landmarker.detectForVideo(v, now); }catch(e){ return; }
  const lm = res && res.landmarks && res.landmarks[0];
  if (!lm){ CAM.steady=0; cam.classList.remove('ready'); hold.style.width='0'; setPill('Show your left palm inside the outline'); return; }
  // map to displayed (object-fit: cover) coordinates
  const vw=v.videoWidth, vh=v.videoHeight, bw=cam.clientWidth, bh=cam.clientHeight;
  const sc=Math.max(bw/vw,bh/vh), ox=(vw*sc-bw)/2, oy=(vh*sc-bh)/2;
  const P=lm.map(p=>({x:(p.x*vw*sc-ox)/bw, y:(p.y*vh*sc-oy)/bh}));
  const ys=P.map(p=>p.y), xs=P.map(p=>p.x);
  const top=Math.min(...ys), bot=Math.max(...ys), lft=Math.min(...xs), rgt=Math.max(...xs);
  const hgt=bot-top;
  const spread = angleDeg(sub(P[8],P[5]), sub(P[20],P[17]));
  let msg='', ok=false;
  if (lft<0.01||rgt>0.99||top<0.01||bot>0.995) msg='Move back a little';
  else if (hgt<0.55) msg='Move a little closer';
  else if (P[12].y > P[0].y) msg='Turn your hand fingers-up';
  else if (spread<4) msg='Spread your fingers slightly';
  else ok=true;
  const c=P[9], move = CAM.last ? Math.hypot(c.x-CAM.last.x, c.y-CAM.last.y) : 1;
  CAM.last={x:c.x,y:c.y};
  if (ok && move<0.012) CAM.steady++; else if (ok) CAM.steady=Math.max(0,CAM.steady-2); else CAM.steady=0;
  cam.classList.toggle('ready', ok);
  const need=12; hold.style.width = Math.min(100,100*CAM.steady/need)+'%';
  setPill(ok ? (CAM.steady>2?'Hold still…':'Looks good, hold still') : msg);
  if (CAM.steady>=need) capture();
}
function capture(){
  const v=document.getElementById('vid');
  if (!CAM.stream || !v || v.readyState<2){ document.getElementById('camIn').click(); return; }
  const c=document.createElement('canvas'); c.width=v.videoWidth; c.height=v.videoHeight;
  c.getContext('2d').drawImage(v,0,0);
  const f=document.getElementById('flash'); f.classList.add('on'); setTimeout(()=>f.classList.remove('on'),40);
  stopCam();
  c.toBlob(b=>showStill(URL.createObjectURL(b)),'image/jpeg',.92);
}
function showStill(url){
  if (S.photoUrl && S.photoUrl!==url) URL.revokeObjectURL(S.photoUrl);
  S.photoUrl=url;
  const img=document.getElementById('still'), v=document.getElementById('vid');
  if (!img) return;
  img.src=url; img.hidden=false; if(v) v.hidden=true;
  document.getElementById('guide').hidden=true; document.getElementById('hold').style.width='0';
  setPill('Is the palm sharp and well lit?');
  document.getElementById('shutterRow').hidden=true;
  bar(`<button class="btn" data-act="retake">Retake</button><button class="btn primary" data-act="usephoto">Use this photo</button>`);
}

/* ---------- Measure hand from the still photo ---------- */
function sub(a,b){return {x:a.x-b.x,y:a.y-b.y}}
function len(a){return Math.hypot(a.x,a.y)}
function dist(a,b){return len(sub(a,b))}
function angleDeg(a,b){const d=(a.x*b.x+a.y*b.y)/(len(a)*len(b)||1);return Math.acos(Math.max(-1,Math.min(1,d)))*180/Math.PI}
function chainLen(P,ids){let s=0;for(let i=1;i<ids.length;i++)s+=dist(P[ids[i-1]],P[ids[i]]);return s}
function measure(lm,w,h){
  const P=lm.map(p=>({x:p.x*w,y:p.y*h}));
  const palmLen=dist(P[0],P[9]), palmW=dist(P[5],P[17]);
  const midLen=chainLen(P,[9,10,11,12]);
  const longPalm = palmLen/palmW > 1.42, longFingers = midLen/palmLen >= 0.86;
  const hand = longPalm ? (longFingers?'water':'fire') : (longFingers?'air':'earth');
  const idx=chainLen(P,[5,6,7,8]), ring=chainLen(P,[13,14,15,16]), r=idx/ring;
  const ivr = r>1.025?'longer':(r<0.975?'shorter':'equal');
  const ta = angleDeg(sub(P[4],P[2]), sub(P[8],P[5]));
  const thumbAngle = ta>=48?'wide':'narrow';
  const near=(x,t,band)=>Math.abs(x-t)<band;
  return {
    hand:{v:hand,c:(near(palmLen/palmW,1.42,.05)||near(midLen/palmLen,.86,.03))?'low':'medium',ai:true},
    indexVsRing:{v:ivr,c:near(r,1,.04)?'low':'medium',ai:true},
    thumbAngle:{v:thumbAngle,c:near(ta,48,6)?'low':'medium',ai:true}
  };
}
async function usePhoto(){
  const btn=document.querySelector('[data-act="usephoto"]'); if(btn){btn.disabled=true;btn.textContent='Measuring…';}
  setPill('Measuring your hand…');
  if (mpState==='idle') loadMP();
  for (let i=0;i<60 && mpState==='loading';i++) await new Promise(r=>setTimeout(r,250));
  let F={}, found=false;
  if (mpState==='ready'){
    try{
      const img=document.getElementById('still'); await img.decode().catch(()=>{});
      const res=landmarker.detectForVideo(img, performance.now()+1);
      const lm=res&&res.landmarks&&res.landmarks[0];
      if (lm){ F=measure(lm,img.naturalWidth,img.naturalHeight); found=true; }
    }catch(e){ console.warn(e); }
  }
  // keep any answers the person already gave
  for (const [k,f] of Object.entries(S.features)) if(!f.ai) F[k]=f;
  S.features=F; S.source=found?'auto':'photo'; S.isSample=false;
  if (!found) toast(mpState==='ready'?'We couldn\'t find a hand to measure. You can answer every question yourself.':'Hand measuring is unavailable. You can answer every question yourself.');
  go('confirm');
}

/* ---------- Questions ---------- */
function renderConfirm(){
  const F=S.features;
  const visible=ALLQ.filter(q=>!q.showIf||q.showIf(F));
  const answered=visible.filter(q=>F[q.id]).length;
  const intro = S.source==='auto'
    ? `We measured your hand shape and fingers from the photo. Check those, then look at your palm and pick the closest match for the rest. Skip anything you can't tell.`
    : `Look at your left palm and pick the closest match. Skip anything you can't tell; the reading uses what you give it.`;
  $app.innerHTML = topbar('photo') + `
  ${S.photoUrl?`<div class="ref"><img src="${S.photoUrl}" alt="Your palm photo"><p>Compare with your photo or your palm as you answer.</p><button class="linkbtn" data-act="zoom">Enlarge</button></div>`:''}
  <section class="stack" style="margin-top:16px">
    <span class="label">Step 2 of 3 · Your palm</span>
    <h2>${S.source==='auto'?'Here\'s what we measured':'Tell us about your palm'}</h2>
    <p class="muted">${intro}</p>
    <div class="progress" aria-hidden="true"><span style="width:${Math.round(100*answered/visible.length)}%"></span></div>
    ${GROUPS.map(g=>`
      <div class="group">
        <div class="g-art">${palmSVG(g.hl,{aria:g.title+' highlighted'})}</div>
        <h3>${g.title} <span class="hi muted">${g.hi}</span></h3>
        <p class="g-sub">${g.sub}</p>
        <div class="qs">${g.qs.filter(q=>!q.showIf||q.showIf(F)).map(q=>{
          const f=F[q.id];
          const badge = f ? (f.ai ? `<span class="badge ${f.c}">${f.c==='low'?'Measured · check':'Measured'}</span>` : `<span class="badge you">Your answer</span>`) : '';
          return `<div class="q" role="group" aria-label="${esc(q.label)}">
            <div class="q-head"><strong>${q.label}${q.hi?` <span class="hi muted">${q.hi}</span>`:''}</strong>${badge}</div>
            ${q.help?`<p class="help">${q.help}</p>`:''}
            <div class="chips">${q.opts.map(([v,l])=>`<button class="chip" data-q="${q.id}" data-v="${v}" aria-pressed="${f&&f.v===v}">${l}</button>`).join('')}</div>
          </div>`;}).join('')}</div>
      </div>`).join('')}
  </section>`;
  bar(`<span class="meta">${answered} of ${visible.length} answered</span><button class="btn primary" data-act="read" ${answered<3?'disabled':''}>Show my reading</button>`);
}

/* ---------- Reading ---------- */
function readingText(R){ return R.map(r=>`${r.i}. ${r.name}: ${r.headline}\n${r.parts.join(' ')}`).join('\n\n'); }
function renderReading(){
  const F=S.features; const R=buildReading(F);
  const hand=F.hand&&F.hand.v;
  const handName={earth:'Earth hand',air:'Air hand',fire:'Fire hand',water:'Water hand'}[hand]||'Your palm';
  const top=[...R].filter(r=>r.strength).sort((a,b)=>b.strength-a.strength).slice(0,2);
  const summary = (R[0].parts[0]||'') + (top.length===2?` Your palm shines brightest in ${top[0].name.toLowerCase()} and ${top[1].name.toLowerCase()}.`:'');
  $app.innerHTML = topbar(S.isSample?'home':'confirm') + `
  <section class="stack">
    <span class="label">${S.isSample?'Sample reading':'Step 3 of 3 · Your reading'}</span>
    ${S.isSample?`<p class="sample-flag">This is an example palm, not yours. Photograph your left palm to get your own reading.</p>`:''}
    <div class="result-hero">
      <div class="stack" style="gap:8px">
        <span class="label">Left palm</span>
        <div class="element">${handName}</div>
        <p style="font-size:.98rem">${esc(summary)}</p>
      </div>
      ${palmSVG(['shape'],{aria:'Your palm type'})}
    </div>
    <div class="cards">
      ${R.map((r,idx)=>`
      <details class="card" ${idx<2?'open':''}>
        <summary>
          <span class="num">${String(r.i).padStart(2,'0')}</span>
          <span class="cat"><span class="label">${r.name}</span><span class="hi muted">${r.hi}</span></span>
          <span class="meter" role="img" aria-label="Strength ${r.strength} of 5">${[1,2,3,4,5].map(n=>`<i class="${n<=r.strength?'on':''}"></i>`).join('')}</span>
          <span></span><span class="headline">${esc(r.headline)}</span>
        </summary>
        <div class="body">
          <div>${r.parts.length?r.parts.map(p=>`<p>${esc(p)}</p>`).join(''):`<p class="muted">Answer the ${r.name.toLowerCase()} questions to read this area.</p>`}</div>
          <div class="mini">${palmSVG(r.hl,{aria:'Where this was read from'})}</div>
          ${r.src.length?`<div class="from"><span class="label">Read from</span>${r.src.map(s=>`<span class="src">${s}</span>`).join('')}</div>`:''}
          ${r.caveat?`<p class="caveat">${r.caveat}</p>`:''}
        </div>
      </details>`).join('')}
    </div>
    ${S.isSample?'':`<div class="rate" role="group" aria-label="Rate your reading">
      <strong>How well does this describe you?</strong>
      <div class="chips">${[['1','Not at all'],['2','A little'],['3','Partly'],['4','Mostly'],['5','Spot on']].map(([v,l])=>`<button class="chip" data-rate="${v}" aria-pressed="${S.rating==v}">${l}</button>`).join('')}</div>
      <p class="muted" style="font-size:.85rem">Your rating is added when you share your reading.</p>
    </div>`}
    <p class="note">For fun and self-reflection. Palmistry is a tradition, not a science; nothing here predicts health, lifespan or fixed events.</p>
    <div id="copyWrap" hidden><textarea class="copybox" id="copyBox" readonly></textarea></div>
  </section>`;
  bar(S.isSample
    ? `<button class="btn" data-go="home">Home</button><button class="btn primary" data-go="photo">Read my palm</button>`
    : `<button class="btn" data-act="restart">Start over</button><button class="btn primary" data-act="share">Share my reading</button>`);
  S.lastText = `My left palm reading: ${handName}\n\n${summary}\n\n${readingText(R)}`;
}
function shareText(){
  const labels={1:'Not at all',2:'A little',3:'Partly',4:'Mostly',5:'Spot on'};
  return (S.rating?`How accurate it felt: ${S.rating}/5 (${labels[S.rating]})\n\n`:'') + S.lastText + `\n\nRead yours: ${location.href.split('#')[0]}`;
}

function render(){
  if (S.screen==='home') renderHome();
  else if (S.screen==='photo') renderPhoto();
  else if (S.screen==='confirm') renderConfirm();
  else renderReading();
}

document.addEventListener('click',async e=>{
  const g=e.target.closest('[data-go]'); if(g){ go(g.dataset.go); return; }
  const ch=e.target.closest('.chip[data-q]'); if(ch){
    const id=ch.dataset.q, v=ch.dataset.v; const cur=S.features[id];
    if (cur && cur.v===v && !cur.ai) delete S.features[id]; else S.features[id]={v,c:'high'};
    const y=window.scrollY; renderConfirm(); window.scrollTo({top:y}); return; }
  const rt=e.target.closest('.chip[data-rate]'); if(rt){ S.rating=Number(rt.dataset.rate); document.querySelectorAll('.chip[data-rate]').forEach(b=>b.setAttribute('aria-pressed', b===rt)); return; }
  const a=e.target.closest('[data-act]'); if(!a) return;
  const act=a.dataset.act;
  if (act==='sample'){ S.features=Object.fromEntries(Object.entries(SAMPLE).map(([k,v])=>[k,{v,c:'high'}])); S.isSample=true; go('reading'); }
  else if (act==='manual'){ if(S.isSample) S.features={}; S.source='manual'; S.isSample=false; go('confirm'); }
  else if (act==='retake'){ if(S.photoUrl) URL.revokeObjectURL(S.photoUrl); S.photoUrl=null; renderPhoto(); }
  else if (act==='usephoto') usePhoto();
  else if (act==='zoom'){ const z=document.createElement('div'); z.className='zoom'; z.innerHTML=`<img src="${S.photoUrl}" alt="Your palm photo, enlarged"><button class="btn primary">Close</button>`; z.onclick=()=>z.remove(); document.body.append(z); }
  else if (act==='read'){ S.isSample=false; S.rating=0; go('reading'); }
  else if (act==='restart'){ S.features={}; if(S.photoUrl)URL.revokeObjectURL(S.photoUrl); S.photoUrl=null; S.source='manual'; S.rating=0; go('home'); }
  else if (act==='share'){
    const text=shareText();
    if (navigator.share){ try{ await navigator.share({title:'My palm reading', text}); return; }catch(err){ if(err&&err.name==='AbortError') return; } }
    try{ await navigator.clipboard.writeText(text); toast('Reading copied. Paste it into WhatsApp'); }
    catch(err){ const w=document.getElementById('copyWrap'),b=document.getElementById('copyBox'); w.hidden=false; b.value=text; b.focus(); b.select(); toast('Select all and copy'); }
  }
});
document.addEventListener('visibilitychange',()=>{ if(document.hidden && S.screen==='photo' && CAM.phase==='live') stopCam(); else if(!document.hidden && S.screen==='photo' && !S.photoUrl && !CAM.stream) startCam(); });
render();

</script>
</body>
</html>
